[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-lang"
version = "1.0.0"
description = "A small language with a tree-walking interpreter, a bytecode VM and a garbage collector."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
keel = "keel.cli:main"

[tool.setuptools.packages.find]
include = ["keel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --timeout=120"
